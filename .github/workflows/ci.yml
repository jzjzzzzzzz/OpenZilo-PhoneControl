name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: macos-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jzjzzzzzzz/combodied-motion-lab
          ref: 839ecc0bc89fd560e29eb6cc1b41f17afe5a51d7
          path: .motion-lab
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install public dependencies
        run: python -m pip install -e '.[rnn]'
      - name: Check dependencies
        run: python -m pip check
      - name: Audit publication boundary
        run: python scripts/check_release.py --tracked
      - name: Test with synthetic model artifacts
        env:
          COMBODIED_MOTION_LAB_PATH: ${{ github.workspace }}/.motion-lab
        run: python -m unittest discover -s tests -v
      - name: Offline replay and shell syntax
        run: |
          ./ringphone replay
          ./ringphone simulate --event up --backend mirroring --dry-run
          ./ringphone phone next --dry-run
          python scripts/demo_imu.py --lab .motion-lab --output results/imu-demo.json
          /bin/sh -n ringphone setup.sh
